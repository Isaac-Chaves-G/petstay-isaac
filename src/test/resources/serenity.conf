serenity {
  project.name = "PetStay - HU-02 - Automatización Front-End"
  outputDirectory = "target/site/serenity"
  take.screenshots = FOR_EACH_ACTION
  restart.browser.for.each = scenario
  report.encoding = UTF8
}
webdriver {
  driver = chrome
  base.url = "https://petstay-aphn.onrender.com"
  timeouts.implicitlywait = 0
  wait.for.timeout = 15000
  capabilities {
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1440,1000", "--disable-dev-shm-usage"]
    }
  }
}
headless.mode = true
serenity.issue.tracker.url = "https://github.com/Isaac-Chaves-G/petstay-isaac/issues/{0}"
