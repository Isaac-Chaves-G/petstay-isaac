name: PetStay Serenity BDD
run-name: PetStay · ${{ github.event.issue.title || inputs.caso || 'Suite completa' }}

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      caso:
        description: 'Caso TC01..TC29 o todos'
        required: true
        default: todos
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  pruebas:
    if: github.event_name != 'issues' || github.event.label.name == 'ejecutar-prueba'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolver caso solicitado
        id: seleccion
        shell: python
        env:
          INPUT_CASE: ${{ inputs.caso }}
        run: |
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)
          case = os.environ.get('INPUT_CASE') or 'todos'
          if os.environ['GITHUB_EVENT_NAME'] == 'issues':
              title = event['issue']['title']
              match = re.match(r'^\[(TC\d{2})\]', title)
              if not match:
                  raise SystemExit('El issue debe comenzar por [TC01]..[TC29]')
              case = match.group(1)
          if case != 'todos' and not re.fullmatch(r'TC(?:0[1-9]|1[0-9]|2[0-9])', case):
              raise SystemExit('Caso inválido')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('tags=' + ('@HU02' if case == 'todos' else '@' + case) + '\n')
      - name: Ejecutar escenarios y generar reporte
        env:
          CUCUMBER_TAGS: ${{ steps.seleccion.outputs.tags }}
        run: bash ./gradlew clean test aggregate "-Dcucumber.filter.tags=$CUCUMBER_TAGS" --console=plain
      - name: Conservar reporte y capturas incluso si una prueba falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/site/serenity/
            build/reports/tests/
            build/test-results/test/
