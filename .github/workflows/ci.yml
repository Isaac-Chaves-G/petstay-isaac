name: PetStay Serenity BDD
run-name: PetStay · ${{ github.event.issue.title || inputs.caso || 'Suite completa' }}

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      caso:
        description: 'TC01..TC29 o todos; admite @ y minúsculas, por ejemplo @tc12'
        required: true
        default: todos
  workflow_call:
    inputs:
      caso:
        type: string
        required: false
        default: todos
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  pruebas:
    if: github.event_name != 'issues' || github.event.label.name == 'ejecutar-prueba'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verificar selección de casos
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Resolver caso solicitado
        id: seleccion
        env:
          INPUT_CASE: ${{ inputs.caso }}
        run: python scripts/select_case.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Ejecutar escenarios y generar reporte
        env:
          CUCUMBER_TAGS: ${{ steps.seleccion.outputs.tags }}
        run: bash ./gradlew clean test aggregate "-Dcucumber.filter.tags=$CUCUMBER_TAGS" --console=plain
      - name: Resumir resultados ejecutados
        if: always() && steps.seleccion.outcome == 'success'
        env:
          INPUT_CASE: ${{ steps.seleccion.outputs.case }}
        run: python scripts/summarize_results.py
      - name: Conservar reporte y capturas incluso si una prueba falla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: serenity-${{ github.run_number }}-${{ steps.seleccion.outputs.case || 'sin-caso' }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/site/serenity/
            build/reports/tests/
            build/test-results/test/
            target/audit-summary.json
